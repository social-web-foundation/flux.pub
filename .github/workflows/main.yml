name: Test and release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag in the form vX.Y.Z"
            exit 1
          fi
          printf 'major=%s\nminor=%s.%s\npatch=%s.%s.%s\n' \
            "${BASH_REMATCH[1]}" \
            "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" \
            "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" \
            >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test release image
        env:
          TEST_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          container_name=flux-pub-smoke
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:9000:9000 \
            --mount type=bind,src="$GITHUB_WORKSPACE/.github/fixtures/bots.js",dst=/etc/bots.js,readonly \
            --env ORIGIN=http://localhost:9000 \
            --env DATABASE_URL=sqlite:/tmp/flux.sqlite \
            --env LOG_LEVEL=warn \
            "$TEST_IMAGE"
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            --max-time 2 --retry-max-time 60 \
            http://127.0.0.1:9000/readyz
      - name: Publish version tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PATCH: ${{ steps.version.outputs.patch }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$MAJOR" \
            --tag "$IMAGE:$MINOR" \
            --tag "$IMAGE:$PATCH" \
            "$IMAGE@$IMAGE_DIGEST"
